const baseDe=code=>String(code).replace(/-[A-Za-z]$/,""),lettreDe=code=>(String(code).match(/-([A-Za-z])$/)||[])[1]||"";

async function chargerClasse(code){

    const [refs,ucs,eps,cands,plans,dates,pers]=await Promise.all([
      api(`/rest/v1/uc_referentiels?code=eq.${encodeURIComponent(ref)}`),
      api(`/rest/v1/uc_ucs?referentiel=eq.${encodeURIComponent(ref)}&order=ordre,code`),

    S.ref=refs[0]||{};S.plan=plans[0]||{};S.dates=dates;S.pers=pers;S.cohorte=coh;S.ucs=ucs;S.epreuves=eps;S.cands=cands;
    const ucIds=ucs.map(u=>u.id).join(",")||"0",epIds=eps.map(e=>e.id).join(",")||"0",cIds=cands.map(c=>c.id).join(",");

  }catch(e){statut("");return erreur(e);}

function peut(n,r){const D=S.droits||{};if(D.admin)return true;const U=D.ucs||[],E=D.epreuves||[];
  const respCI=ci=>S.epCis.some(x=>x.ci_id===ci&&E.includes(x.epreuve_id));
  if(n==="epreuve")return E.includes(r)||S.epCis.some(x=>x.epreuve_id===r&&U.includes((S.cis.find(c=>c.id===x.ci_id)||{}).uc_id));
  if(n==="uc")return U.includes(r)||S.cis.some(ci=>ci.uc_id===r&&respCI(ci.id));
  const ci=n==="cr"?(S.crs.find(x=>x.id===r)||{}).ci_id:r,c=S.cis.find(x=>x.id===ci)||{};
  return U.includes(c.uc_id)||respCI(ci);}

function progression(c){
  let fait4=0,tot4=0;
  for(const ep of S.epreuves){for(const ci of cisEpreuve(ep.id)){if(validation(c,ci.uc_id))continue;
      for(const cr of crsDe(ci)){tot4++;if(rempli(c,"cr",cr.id))fait4++;}
      tot4++;if(rempli(c,"ci",ci.id))fait4++;}
    tot4++;if(rempli(c,"epreuve",ep.id))fait4++;}
  let fait5=0,tot5=0;
  for(const u of S.ucs){if(validation(c,u.id))continue;tot5++;if(rempli(c,"uc",u.id))fait5++;}
  return {fait4,tot4,fait5,tot5};
}

const periodes=e=>[[e.p1_du,e.p1_au],[e.p2_du,e.p2_au],[e.p3_du,e.p3_au]].filter(p=>p[0]).map(p=>({du:p[0],au:p[1]||p[0]}));
const fr2=iso=>new Date(iso+"T12:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"});

const dansPeriode=(e,j)=>{const P=periodes(e);return !P.length||P.some(p=>j>=p.du&&j<=p.au);};
const ajout=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toLocaleDateString("sv-SE");};
const AUJ=()=>new Date().toLocaleDateString("sv-SE");
function echeance(e,d){const auj=AUJ();
  if(!d.jour){const p=periodes(e).map(x=>x.du).filter(x=>x>=auj).sort()[0];if(!p)return "";const lim=ajout(p,-15);
    return `<span class="acq${lim<=auj?" non":""}">à fixer avant le ${esc(frDate(lim))}</span>`;}
  return d.jour<ajout(auj,15)&&d.jour>=auj&&!d.convoc_le?`<span class="acq non">moins de 15 jours</span>`:"";}
const lundiDe=iso=>{const d=new Date(iso+"T12:00:00"),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return d.toLocaleDateString("sv-SE");};
function sessions(G){const R=[];
  for(const g of G)for(const e of S.epreuves){const d=dateDe(e.id,g.code);if(!d.jour)continue;const l=lundiDe(d.jour);
    let x=R.find(y=>y.g.code===g.code&&y.lundi===l);if(!x){x={g,lundi:l,items:[]};R.push(x);}x.items.push({e,d});}
  R.forEach(x=>x.items.sort((a,b)=>(a.d.jour+a.d.heure).localeCompare(b.d.jour+b.d.heure)));
  return R.sort((a,b)=>a.lundi.localeCompare(b.lundi)||a.g.code.localeCompare(b.g.code));}

  const H=["Capacité globale de l'UC",objectifs()?"N° OI rang 1 + thème":"Capacité intermédiaire","N° épreuve","Rappels des critères d'évaluation",
           objectifs()?"Appréciation\nGlobale relative à l'OI de rang 1":"Appréciation\nGlobale relative à la capacité intermédiaire",
           "Proposition argumentée\nsur la validation de la capacité globale","Avis du Jury\ndate"];
  for(const u of S.ucs){const oe=ci=>{const e=epreuveDe(ci);return e?e.ordre*1000+S.epreuves.indexOf(e):1e9;};
    const cis=S.cis.filter(x=>x.uc_id===u.id).sort((a,b)=>oe(a)-oe(b)||byOrd(a,b)),v=validation(c,u.id),n=Math.max(1,cis.length);
    const vtxt=v?(v.statut==="vaa"?"VAA":"Validée le "+frDate(v.le)):"";
    (cis.length?cis:[null]).forEach((ci,i)=>{const ep=ci&&epreuveDe(ci);
      rows+=`<tr>${i===0?`<td rowspan="${n}" data-l="${esc(H[0])}">${esc(u.code+" "+u.nom)}</td>`:""}
        <td data-l="${esc(H[1])}">${ci?esc(ci.code+" "+ci.nom):""}</td><td class="c" data-l="${esc(H[2])}">${ep?`<span title="${esc(ep.nom)}">${esc(ep.code)}</span>`:""}</td>
        <td class="rap" data-l="${esc(H[3])}">${ci?crsDe(ci).map(r=>`<div class="rc">${crHtml(r)}</div>`).join(""):""}</td>
        <td data-l="${esc(H[4])}">${!ci?"":v?`<span class="valide">${esc(vtxt)}</span>`:champ(c,"ci",ci.id,crsDe(ci).length?{aria:"Appréciation "+ci.code,auto:"ci"}:{aria:"Appréciation "+ci.code,acquis:ACQ_CI})}</td>
        ${i===0?`<td rowspan="${n}" data-l="${esc(H[5])}">${v?`<span class="valide">${esc(vtxt)}</span>`:champ(c,"uc",u.id,{aria:"Proposition "+u.code,auto:"uc"})}</td>
                  <td rowspan="${n}" data-l="${esc(H[6])}"></td>`:""}</tr>`;});
  }
  $("#view").innerHTML=`<div class="off d5off">`+entete("DOCUMENT 5 : TABLEAU RECAPITULATIF PAR CANDIDAT ET PAR UC")+`
    <table class="doc d5"><colgroup><col style="width:15.3%"><col style="width:15.3%"><col style="width:7.2%"><col style="width:18.3%"><col style="width:18.4%"><col style="width:18.3%"><col style="width:7.2%"></colgroup>
    <thead><tr>${H.map(th).join("")}</tr></thead><tbody>${rows}</tbody></table>
    <p class="sign"><span>Le _______ / _______ / 20_______</span><span>Signature du Président-adjoint du jury</span></p></div>`;
}
/* ---------- Enregistrement automatique ---------- */
const timers=new Map(),enCours=new Map();
function planifier(cell,delai=1200){const k=kS(cell.dataset.c,cell.dataset.n,cell.dataset.r);
  clearTimeout(timers.get(k));statut("Modifications non enregistrées…");timers.set(k,setTimeout(()=>enregistrer(cell),delai));}
async function enregistrer(cell,extra={}){
  const c=cell.dataset.c,n=cell.dataset.n,r=+cell.dataset.r,k=kS(c,n,r);clearTimeout(timers.get(k));
  if(enCours.get(k)){await enCours.get(k);}
  const cur=S.saisies.get(k)||{},ta=cell.querySelector("textarea"),acq=cell.querySelector("[data-acq]");
  const texte=ta?ta.value:cur.texte||"",acquis=acq?(acq.value===""?null:acq.value==="1"):(cur.acquis??null);
  const date=extra.date!==undefined?extra.date:(cur.date_eval||null);
  if(cur.version&&texte===cur.texte&&acquis===(cur.acquis??null)&&date===(cur.date_eval||null)){statut("");return;}
  if(!cur.version&&!texte.trim()&&acquis===null&&!date){statut("");return;}
  statut("Enregistrement…");
  const p=rpc("uc_saisir",{p_candidat:c,p_niveau:n,p_ref:r,p_texte:texte,p_acquis:acquis,p_date:date,p_version:cur.version||null})
    .then(res=>{const aq=res.acquis!==undefined?res.acquis:acquis;
      S.saisies.set(k,Object.assign({},cur,{candidat:c,niveau:n,ref_id:r,texte,acquis:aq,date_eval:date,version:res.version,maj_nom:res.maj_nom,maj_le:res.maj_le}));
      for(const [nv,id,a] of [["ci",res.ci,res.ci_acquis],["uc",res.uc,res.uc_acquis]])if(id){const kx=kS(c,nv,id),o=S.saisies.get(kx);
        if(o)o.acquis=a;else S.saisies.set(kx,{candidat:c,niveau:nv,ref_id:id,texte:"",acquis:a,version:1});majAuto(nv,c,id);}
      if(n==="ci"||n==="uc")majAuto(n,c,r);majVerrous();
      const m=cell.querySelector("[data-m]");if(m)m.textContent="par "+res.maj_nom+", "+frDH(res.maj_le);
      const pr=cell.querySelector(".print-only");if(pr&&n!=="ci"&&n!=="uc")pr.textContent=(cell.dataset.po&&aq!=null?(aq?cell.dataset.po:cell.dataset.pn)+"\n":"")+texte;
      if(n==="epreuve"){const d=document.querySelector("#dEval+.print-only");if(d)d.textContent=frDate(date);}
      statut("Enregistré");})
    .catch(async e=>{
      if(/CONFLIT/.test(e.message)){const qui=e.message.replace(/^.*CONFLIT \d+ ?/,"");
        toast(`${qui||"Un collègue"} vient de modifier cette appréciation : sa version est affichée, votre texte est copié dans le presse-papiers.`);
        try{await navigator.clipboard.writeText(texte);}catch(_){}
        const d=await api(`/rest/v1/uc_saisies?candidat=eq.${c}&niveau=eq.${n}&ref_id=eq.${r}`);if(d[0])S.saisies.set(k,d[0]);render();statut("");}
      else statut("Non enregistré : "+e.message.replace(/^(ORDRE|DROIT) : /,""),true);})
    .finally(()=>enCours.delete(k));
  enCours.set(k,p);return p;
}
document.addEventListener("input",e=>{const cell=e.target.closest(".cell");if(cell&&e.target.tagName==="TEXTAREA")planifier(cell);});
document.addEventListener("change",e=>{const cell=e.target.closest(".cell");
  if(cell&&e.target.matches("[data-acq]"))return enregistrer(cell);
  if(e.target.id==="dEval"){const ep=S.epr,c=S.cand;const fake=document.querySelector(`.cell[data-n="epreuve"][data-r="${ep}"]`);if(fake)enregistrer(fake,{date:e.target.value||null});}
  if(e.target.dataset&&e.target.dataset.d)return majDate(e.target);
  if(e.target.id==="selClasse")chargerClasse(e.target.value);
  if(e.target.id==="selGrp"){S.grp=e.target.value;majCands();render();}
  if(e.target.id==="selCand"){S.cand=e.target.value;render();}
  if(e.target.id==="selEpr"){S.epr=+e.target.value;render();}});
document.addEventListener("focusout",e=>{const cell=e.target.closest&&e.target.closest(".cell");if(cell&&e.target.tagName==="TEXTAREA")enregistrer(cell);});
window.addEventListener("beforeunload",e=>{if([...timers.values()].length&&$("#status").textContent.startsWith("Modifications")){e.preventDefault();e.returnValue="";}});

/* ---------- Navigation ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.z){await toutEnregistrer();S.zone=b.dataset.z;history.replaceState(null,"","?vue="+(S.zone==="saisie"?S.vue:S.zone));render();}
  else if(b.dataset.v){await toutEnregistrer();S.vue=b.dataset.v;history.replaceState(null,"","?vue="+S.vue);render();}
  else if(b.dataset.saisir){S.zone="saisie";S.vue="doc4";S.epr=+b.dataset.saisir;S.grp=b.dataset.g||"";$("#selGrp").value=S.grp;majCands();render();window.scrollTo(0,0);}
  else if(b.dataset.go){await toutEnregistrer();if(b.dataset.c)S.cand=b.dataset.c;S.zone="saisie";S.vue=b.dataset.go;render();window.scrollTo(0,0);}
  else if(b.id==="prev"||b.id==="next"){await toutEnregistrer();const L=candsVis(),i=L.findIndex(c=>c.id===S.cand),j=i+(b.id==="next"?1:-1);
    if(j>=0&&j<L.length){S.cand=L[j].id;render();}}
  else if(b.id==="btnPrint"){await toutEnregistrer();$("#pageSize").textContent="@page{size:A3 portrait}";window.print();}
  else if(b.hasAttribute("data-sug"))suggestions(b.closest(".cell"));
  else if(b.hasAttribute("data-edit")){const cell=b.closest(".cell");basculer(cell,!cell.classList.contains("edit"));}
  else if(b.hasAttribute("data-convs"))convocationsSession(b.dataset.cl,b.dataset.lundi);
  else if(b.hasAttribute("data-convsok"))marquerSession(b.dataset.cl,b.dataset.lundi,true);
  else if(b.hasAttribute("data-convsno"))marquerSession(b.dataset.cl,b.dataset.lundi,false);
  else if(b.dataset.lot){await toutEnregistrer();b.dataset.lot==="doc5"?lotDoc5():grilleUC();}
  else if(b.id==="sugClose")$("#sug").hidden=true;
});
async function toutEnregistrer(){await Promise.all($$(".cell").filter(c=>timers.has(kS(c.dataset.c,c.dataset.n,c.dataset.r))).map(c=>enregistrer(c)));}

/* ---------- Bibliothèque d'appréciations ---------- */
let sugCell=null;
async function suggestions(cell){
  sugCell=cell;const n=cell.dataset.n,r=+cell.dataset.r;
  const nom=n==="cr"?(S.crs.find(x=>x.id===r)||{}).nom:n==="ci"?(()=>{const x=S.cis.find(y=>y.id===r)||{};return x.code+" "+x.nom;})()
          :n==="uc"?(()=>{const x=S.ucs.find(y=>y.id===r)||{};return x.code+" "+x.nom;})():"Appréciation globale de l'épreuve";
  $("#sugRappel").textContent="Pour : "+nom;$("#sugList").innerHTML="<li>Chargement…</li>";$("#sug").hidden=false;$("#sugClose").focus();
  try{const L=await rpc("uc_suggestions",{p_niveau:n,p_ref:r});
    $("#sugList").innerHTML=L.length?L.map((s,i)=>`<li><button type="button" data-i="${i}">${esc(s.texte)}<small>${s.acquis===true?(n==="uc"?"Proposée valide":"Acquis"):s.acquis===false?(n==="uc"?"Proposée non valide":"Non acquis"):""} · utilisée ${s.nb} fois · ${frDate(s.dernier)}</small></button></li>`).join("")
      :"<li>Aucune appréciation enregistrée pour cet élément.</li>";
    $$("#sugList button").forEach(bt=>bt.onclick=()=>{const s=L[+bt.dataset.i],ta=sugCell.querySelector("textarea");
      ta.value=ta.value.trim()?ta.value.trim()+"\n"+s.texte:s.texte;const acq=sugCell.querySelector("[data-acq]");
      if(acq&&acq.value===""&&s.acquis!=null)acq.value=s.acquis?"1":"0";$("#sug").hidden=true;enregistrer(sugCell);ta.focus();});
  }catch(err){$("#sugList").innerHTML=`<li>${esc(err.message)}</li>`;}
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#sug").hidden=true;});
init();
</script>
